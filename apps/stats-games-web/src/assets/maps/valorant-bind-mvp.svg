<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Valorant map preview">
  <defs>
    <linearGradient id="val-floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#0e1018"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#val-floor)"/>
  <!-- Mid corridor -->
  <rect x="340" y="120" width="120" height="560" rx="12" fill="#2a2435" stroke="#ff4655" stroke-opacity="0.25" stroke-width="2"/>
  <!-- A site -->
  <rect x="500" y="80" width="220" height="220" rx="16" fill="#32283a" stroke="#ff6b7a" stroke-opacity="0.45" stroke-width="2"/>
  <text x="610" y="200" text-anchor="middle" fill="#ff6b7a" font-family="system-ui,sans-serif" font-size="42" font-weight="700">A</text>
  <!-- B site -->
  <rect x="80" y="500" width="220" height="220" rx="16" fill="#32283a" stroke="#ff6b7a" stroke-opacity="0.45" stroke-width="2"/>
  <text x="190" y="620" text-anchor="middle" fill="#ff6b7a" font-family="system-ui,sans-serif" font-size="42" font-weight="700">B</text>
  <!-- Spawns -->
  <circle cx="100" cy="700" r="28" fill="#ff4655" fill-opacity="0.35" stroke="#ff4655" stroke-width="2"/>
  <circle cx="700" cy="100" r="28" fill="#7dd3fc" fill-opacity="0.35" stroke="#7dd3fc" stroke-width="2"/>
  <text x="100" y="760" text-anchor="middle" fill="#c6d0e0" font-family="system-ui,sans-serif" font-size="18">ATK</text>
  <text x="700" y="60" text-anchor="middle" fill="#c6d0e0" font-family="system-ui,sans-serif" font-size="18">DEF</text>
</svg>
