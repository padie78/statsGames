type Mutation {
  ping(message: String!): String! @aws_api_key @aws_cognito_user_pools
  upsertPlayerProfile(input: UpsertPlayerProfileInput!): PlayerProfile!
    @aws_api_key
    @aws_cognito_user_pools
  linkPlatformAccount(input: LinkPlatformAccountInput!): PlayerProfile!
    @aws_api_key
    @aws_cognito_user_pools
  requestEvolutionAiReport(input: RequestEvolutionAiReportInput!): EvolutionAiReport!
    @aws_api_key
    @aws_cognito_user_pools
  upsertTargetProgram(input: UpsertTargetProgramInput!): TargetProgram!
    @aws_api_key
    @aws_cognito_user_pools
  upsertActualExecution(input: UpsertActualExecutionInput!): ActualExecution!
    @aws_api_key
    @aws_cognito_user_pools
  syncObjectiveActualsFromMatches(input: SyncObjectiveActualsFromMatchesInput!): SyncObjectiveActualsResult!
    @aws_api_key
    @aws_cognito_user_pools
  closeTargetProgram(input: CloseTargetProgramInput!): TargetProgram!
    @aws_api_key
    @aws_cognito_user_pools
  publishMatchUpdate(input: MatchUpdateInput!): MatchUpdate @aws_api_key
  publishMatchAiReady(input: MatchAiReadyInput!): MatchAiReady @aws_api_key
  publishEvolutionAiReady(input: EvolutionAiReadyInput!): EvolutionAiReady @aws_api_key
}

type Subscription {
  onMatchUpdate(userId: ID!): MatchUpdate
    @aws_subscribe(mutations: ["publishMatchUpdate"])
    @aws_cognito_user_pools
  onMatchAiReady(userId: ID!): MatchAiReady
    @aws_subscribe(mutations: ["publishMatchAiReady"])
    @aws_cognito_user_pools
  onEvolutionAiReady(userId: ID!): EvolutionAiReady
    @aws_subscribe(mutations: ["publishEvolutionAiReady"])
    @aws_cognito_user_pools
}

